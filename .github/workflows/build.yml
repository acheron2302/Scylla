name: Build Scylla

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, Win32]
        build_type: [Release]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        shell: bash
        run: cmake -B build -A ${{ matrix.architecture }} -DSCYLLA_PYTHON=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config "${{ matrix.build_type }}"

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build/src/${{ matrix.build_type }}/Scylla.dll" artifacts/
          Copy-Item "build/src/${{ matrix.build_type }}/ScyllaExe.exe" artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scylla-${{ matrix.architecture }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release artifacts
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: downloaded-artifacts

      - name: Package release assets
        shell: bash
        run: |
          test -d downloaded-artifacts || { echo "No artifacts were downloaded"; exit 1; }
          mkdir -p release-assets
          for artifact_dir in downloaded-artifacts/*; do
            test -d "$artifact_dir" || continue
            artifact_name="$(basename "$artifact_dir")"
            (cd "$artifact_dir" && zip -r "../../release-assets/${artifact_name}.zip" .)
          done
          test -n "$(find release-assets -type f -name '*.zip' -print -quit)" || { echo "No release assets were packaged"; exit 1; }
          ls -la release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('scylla-autobuild-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Scylla {0}', github.ref_name) || format('Scylla auto build #{0}', github.run_number) }}
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
