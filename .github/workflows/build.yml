name: Build Scylla

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.architecture }} (${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, Win32]
        build_type: [Release, Debug]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        shell: bash
        run: cmake -B build -A ${{ matrix.architecture }} -DSCYLLA_PYTHON=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config "${{ matrix.build_type }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scylla_${{ matrix.architecture }}_${{ matrix.build_type }}
          path: |
            .\build\src\${{ matrix.build_type }}\Scylla.dll
            .\build\src\${{ matrix.build_type }}\ScyllaExe.exe
          retention-days: 3

      - name: Package release binaries
        if: github.event_name == 'release' && github.event.action == 'published' && matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $dist = "dist/scylla-${{ matrix.architecture }}"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "build/src/${{ matrix.build_type }}/Scylla.dll" $dist
          Copy-Item "build/src/${{ matrix.build_type }}/ScyllaExe.exe" $dist
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/Scylla-${{ matrix.architecture }}-${{ github.event.release.tag_name }}.zip" -Force

      - name: Upload release asset
        if: github.event_name == 'release' && github.event.action == 'published' && matrix.build_type == 'Release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/Scylla-${{ matrix.architecture }}-${{ github.event.release.tag_name }}.zip" \
            --clobber
